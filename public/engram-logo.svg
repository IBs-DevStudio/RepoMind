<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none">
  <defs>
    <linearGradient id="engram-grad-full-emblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="engram-text-grad-dual" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Emblem -->
  <g transform="translate(4, 5)">
    <rect width="40" height="40" rx="10" fill="url(#engram-grad-full-emblem)" />
    <circle cx="20" cy="20" r="14" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.35" />

    <line x1="20" y1="10" x2="20" y2="15.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="20" y1="24.5" x2="20" y2="30" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="12" y1="14" x2="16.5" y2="17.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="23.5" y1="22.8" x2="28" y2="26" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="28" y1="14" x2="23.5" y2="17.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="16.5" y1="22.8" x2="12" y2="26" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.9" />

    <circle cx="20" cy="10" r="2.3" fill="#FFFFFF" />
    <circle cx="28" cy="14" r="2.3" fill="#FFFFFF" />
    <circle cx="28" cy="26" r="2.3" fill="#FFFFFF" />
    <circle cx="20" cy="30" r="2.3" fill="#FFFFFF" />
    <circle cx="12" cy="26" r="2.3" fill="#FFFFFF" />
    <circle cx="12" cy="14" r="2.3" fill="#FFFFFF" />

    <circle cx="20" cy="20" r="4.8" fill="#FFFFFF" />
    <circle cx="20" cy="20" r="2.3" fill="#2563EB" />
  </g>

  <!-- Typography -->
  <text x="56" y="27" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="currentColor" letter-spacing="-0.7">En<tspan fill="url(#engram-text-grad-dual)" font-weight="800">gram</tspan></text>
  <circle cx="138" cy="21" r="2.5" fill="#3B82F6" />
  <text x="56" y="41" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#2563EB" letter-spacing="0.2">our codebase’s memory</text>
</svg>
